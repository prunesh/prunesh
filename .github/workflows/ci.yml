name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Check version consistency
        run: |
          go_ver=$(grep 'const version = ' cmd/prunesh/main.go | sed 's/.*"\([^"]*\)".*/\1/')
          if [ -z "$go_ver" ]; then
            echo "could not extract version from cmd/prunesh/main.go"
            exit 1
          fi
          echo "canonical version: $go_ver"
          failed=0
          check() {
            local label=$1 val=$2
            if [ "$val" != "$go_ver" ]; then
              echo "version drift: $label = '$val', expected '$go_ver'"
              failed=1
            else
              echo "ok: $label = $val"
            fi
          }
          check ".claude-plugin/marketplace.json"   "$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)"
          check ".claude-plugin/plugin.json"        "$(jq -r '.version' .claude-plugin/plugin.json)"
          check "integrations/claude/.claude-plugin/plugin.json" "$(jq -r '.version' integrations/claude/.claude-plugin/plugin.json)"
          check "plugins/mcpscan/mcpscan.go"        "$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' plugins/mcpscan/mcpscan.go | head -1)"
          exit $failed

      - name: Check plugin manifest field consistency
        run: |
          for field in name author license repository homepage; do
            root=$(jq -r ".${field} // .${field}.name // empty" .claude-plugin/plugin.json 2>/dev/null)
            plugin=$(jq -r ".${field} // .${field}.name // empty" integrations/claude/.claude-plugin/plugin.json 2>/dev/null)
            if [ "$root" != "$plugin" ]; then
              echo "manifest drift: field '${field}' differs"
              echo "  .claude-plugin/plugin.json:                        ${root}"
              echo "  integrations/claude/.claude-plugin/plugin.json:    ${plugin}"
              exit 1
            fi
          done
          echo "plugin manifest fields are consistent"

      - name: Check hook scripts are executable
        run: |
          failed=0
          for f in \
            integrations/claude/scripts/prunesh-post-tool-use.sh \
            integrations/claude/scripts/prunesh-pre-tool-use.sh \
            integrations/cursor/hooks/prunesh-pre-tool-use.sh \
            integrations/cursor/hooks/prunesh-post-tool-use.sh \
            integrations/codex/hooks/prunesh-pre-tool-use.sh
          do
            mode=$(git ls-files -s "$f" | awk '{print $1}')
            if [ "$mode" != "100755" ]; then
              echo "$f is not executable in git (mode: $mode)"
              echo "fix: git update-index --chmod=+x $f"
              failed=1
            else
              echo "ok: $f"
            fi
          done
          exit $failed
