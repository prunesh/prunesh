name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Verify version consistency across config files ───────────────────────────
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version consistency across files
        run: |
          tag="${GITHUB_REF_NAME#v}"
          failed=0
          check() {
            local label=$1 val=$2
            if [ "$val" != "$tag" ]; then
              echo "version drift: $label = '$val', expected '$tag'"
              failed=1
            else
              echo "ok: $label = $val"
            fi
          }
          check ".claude-plugin/marketplace.json"   "$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)"
          check ".claude-plugin/plugin.json"        "$(jq -r '.version' .claude-plugin/plugin.json)"
          check "integrations/claude/.claude-plugin/plugin.json" "$(jq -r '.version' integrations/claude/.claude-plugin/plugin.json)"
          exit $failed

  # ── Build scripts archive ────────────────────────────────────────────────────
  scripts:
    runs-on: ubuntu-latest
    needs: version-check
    steps:
      - uses: actions/checkout@v4

      - name: Build scripts archive
        run: |
          tar -czf prunesh-scripts.tar.gz integrations/cursor integrations/codex integrations/opencode
          shasum -a 256 prunesh-scripts.tar.gz > prunesh-scripts.tar.gz.sha256

      - name: Upload scripts archive
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            prunesh-scripts.tar.gz
            prunesh-scripts.tar.gz.sha256

  # ── Build binaries (matrix, native runners) ──────────────────────────────────
  release:
    needs: version-check
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            runner: macos-latest
          - goos: darwin
            goarch: amd64
            runner: macos-latest
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - goos: windows
            goarch: amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          EXT=""
          [ "${{ matrix.goos }}" = "windows" ] && EXT=".exe"
          go build \
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o prunesh-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} \
            ./cmd/prunesh/

      - name: Checksum
        run: |
          EXT=""
          [ "${{ matrix.goos }}" = "windows" ] && EXT=".exe"
          shasum -a 256 prunesh-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} \
            > prunesh-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}.sha256

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            prunesh-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
            prunesh-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}.sha256
