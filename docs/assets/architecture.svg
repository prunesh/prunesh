<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-label="Architecture: registry.Module implemented by built-in plugins and marketplace binaries, resolved by proxy.Run">
  <title>prunesh architecture</title>
  <rect width="720" height="430" fill="#f5f0e8"/>
  <defs>
    <marker id="arr2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#6e6255"/>
    </marker>
  </defs>

  <rect x="140" y="16" width="440" height="70" fill="#ebe3d7" stroke="#6e6255" stroke-width="1.5"/>
  <text x="360" y="42" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#3d3228">registry.Module</text>
  <text x="360" y="66" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6e6255">Name / Rewrite / FilterOutput / TokensBefore / TokensAfter</text>

  <line x1="360" y1="86" x2="360" y2="112" stroke="#6e6255" stroke-width="1.5"/>
  <line x1="180" y1="112" x2="540" y2="112" stroke="#6e6255" stroke-width="1.5"/>
  <line x1="180" y1="112" x2="180" y2="136" stroke="#6e6255" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="540" y1="112" x2="540" y2="136" stroke="#6e6255" stroke-width="1.5" marker-end="url(#arr2)"/>

  <rect x="40" y="136" width="280" height="150" fill="#ebe3d7" stroke="#6e6255" stroke-width="1.5"/>
  <text x="180" y="168" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#3d3228">built-in</text>
  <text x="180" y="196" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6e6255">plugins/*.go</text>
  <text x="180" y="216" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6e6255">registry.Register at init</text>
  <text x="180" y="236" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6e6255">blank import in main.go</text>
  <text x="180" y="256" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6e6255">lives inside the binary</text>

  <rect x="400" y="136" width="280" height="150" fill="#ebe3d7" stroke="#6e6255" stroke-width="1.5"/>
  <text x="540" y="168" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#3d3228">marketplace</text>
  <text x="540" y="196" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6e6255">prunesh.json / stdin/v1</text>
  <text x="540" y="216" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6e6255">~/.prunesh/plugins/</text>
  <text x="540" y="236" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6e6255">plugins.db / active wins</text>
  <text x="540" y="256" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6e6255">subprocess adapter</text>

  <line x1="180" y1="286" x2="180" y2="318" stroke="#6e6255" stroke-width="1.5"/>
  <line x1="540" y1="286" x2="540" y2="318" stroke="#6e6255" stroke-width="1.5"/>
  <line x1="180" y1="318" x2="540" y2="318" stroke="#6e6255" stroke-width="1.5"/>
  <line x1="360" y1="318" x2="360" y2="344" stroke="#6e6255" stroke-width="1.5" marker-end="url(#arr2)"/>

  <rect x="140" y="344" width="440" height="70" fill="#ebe3d7" stroke="#6e6255" stroke-width="1.5"/>
  <text x="360" y="370" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#3d3228">proxy.Run</text>
  <text x="360" y="394" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6e6255">plugins.db active, else registry.Get - same code path</text>
</svg>
